# Render Blueprint — 백엔드(FastAPI) 무료 배포 (네이티브 Python + SQLite)
#
# 사용법:
#   1) Render(https://render.com) 가입 → GitHub 저장소 연결
#   2) New + → "Blueprint" → 이 저장소 선택 → render.yaml 자동 감지
#   3) DATA_GO_KR_API_KEY / KMA_API_KEY 는 비워두고 → Apply
#   4) 빌드/배포 (첫 빌드 ~5분) → https://airport-risk-backend.onrender.com
#   5) /health 로 확인 → Vercel VITE_API_URL 연결 (docs/DEPLOY_RENDER_VERCEL.md)
#
# 주의(무료 티어):
#   - 15분간 요청 없으면 잠듦 → 다음 첫 요청이 30~60초 느림(콜드스타트)
#   - SQLite는 재배포/재시작 시 초기화됨(데모용). 영속 DB 필요하면 Postgres로 전환.
#
# Docker 대신 네이티브 Python 런타임 사용: 무료 티어에서 더 가볍고 안정적.

services:
  - type: web
    name: airport-risk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: USE_SQLITE
        value: "true"
      - key: ENV
        value: production
      # 운영 시크릿은 Render가 자동 생성(랜덤) — 직접 입력 불필요
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # SQLite라 실제로 안 쓰지만, production 검증 통과용(기본값 'postgres' 금지)
      - key: DB_PASSWORD
        value: sqlite-unused
      # ⚠️ 배포 후 실제 Vercel 도메인으로 교체하세요 (콤마로 여러 개 가능)
      - key: CORS_ORIGINS_STR
        value: "https://YOUR-APP.vercel.app,http://localhost:5173"
      # 무료 공개 API 키(있으면 입력 → 더 많은 카테고리 채워짐. 없으면 비워두기)
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: KMA_API_KEY
        sync: false

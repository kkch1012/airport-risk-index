# ===========================================
# 아르고스 CI 파이프라인
# push/PR to main → 린트 + 테스트 + 빌드
# ===========================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------
  # Backend 린트 (flake8 + isort + black + mypy)
  # -------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8 (syntax errors)
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (warnings)
        run: flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: isort (check)
        run: isort app/ --check-only --diff

      - name: black (check)
        run: black app/ --check --diff

      - name: mypy (advisory)
        run: mypy app/ --ignore-missing-imports --no-error-summary || true

  # -------------------------------------------
  # Backend 테스트 (pytest 315개 + coverage)
  # -------------------------------------------
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      USE_SQLITE: "true"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
      JWT_SECRET_KEY: ci-test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # -------------------------------------------
  # Frontend (ESLint + TypeScript + Vite 빌드)
  # -------------------------------------------
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 3
